[project]
name = "trading212-mcp-server"
version = "0.5.0"
description = "MCP server for Trading 212 - 28 tools for portfolio management, trading, pies, dividends, and analytics. Works with Claude, ChatGPT, Cursor, and any MCP client."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rishabh Dogra", email = "contact@kyuish.com" }]
keywords = [
    "mcp", "trading212", "trading", "portfolio", "stocks",
    "model-context-protocol", "claude", "llm", "ai-tools",
    "investment", "broker-api", "dividends", "pies",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Developers",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.8.0",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/nunoarmada/trading212-mcp"
Repository = "https://github.com/nunoarmada/trading212-mcp"
"Bug Tracker" = "https://github.com/nunoarmada/trading212-mcp/issues"

[project.scripts]
trading212-mcp-server = "trading212_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading212_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tool modules are star-imported only to register their tools.
"src/trading212_mcp_server/tools/__init__.py" = ["F403"]
